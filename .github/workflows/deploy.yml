name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create .env
        run: |
          cat > .env <<'ENVEOF'
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          COS_SECRET_ID=${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY=${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET=${{ secrets.COS_BUCKET }}
          COS_REGION=${{ secrets.COS_REGION }}
          NEXT_PUBLIC_COS_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_COS_PUBLIC_BASE_URL }}
          DB_PATH=${{ secrets.DB_PATH }}
          SITE_URL=${{ secrets.SITE_URL }}
          ENVEOF

      - name: Build
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync standalone server
        run: |
          rsync -az --delete \
            .next/standalone/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Sync static assets & public
        run: |
          rsync -az --delete \
            .next/static/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/.next/static/
          rsync -az --delete \
            public/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/public/

      - name: Upload env & startup files
        run: |
          scp .env start.mjs ecosystem.config.cjs \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Restart PM2
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             mkdir -p data && \
             pm2 delete flight-albums 2>/dev/null; \
             pm2 start ecosystem.config.cjs && \
             pm2 save"
